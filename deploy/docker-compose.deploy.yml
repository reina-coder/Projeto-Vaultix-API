# Compose usado SOMENTE pelo pipeline de deploy (staging e produção).
# A imagem já vem pronta do GitHub Container Registry; o banco Oracle é externo.
services:
  vaultix-api:
    image: ${IMAGE}
    container_name: vaultix-api-${APP_ENV}
    ports:
      - "${HOST_PORT}:8080"
    environment:
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400}
      SERVER_PORT: 8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
