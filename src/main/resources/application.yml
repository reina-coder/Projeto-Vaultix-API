spring:
  application:
    name: vaultix-api

  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
    username: ${DB_USER:vaultix}
    password: ${DB_PASSWORD:vaultix_password}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none               # Flyway controla todo o schema
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true      # permite usar schema com objetos pre-existentes
    baseline-version: 0
    validate-on-migrate: false     # nao valida checksums (evita erro apos editar SQL)
    out-of-order: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# Configuracoes proprias da aplicacao
vaultix:
  jwt:
    # Secret em Base64 com >= 256 bits. Em producao, usar variavel de ambiente.
    secret: ${JWT_SECRET:dmF1bHRpeC1sb2NhbC1zZWNyZXQta2V5LWZvci1kZXZlbG9wbWVudC1vbmx5LTIwMjY=}
    expiration-seconds: ${JWT_EXPIRATION:86400}   # 24h

# Swagger UI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    br.com.fiap.vaultix: DEBUG
    org.flywaydb: INFO
